[project]
name = "leetcode-review"
version = "0.1.0"
description = "Local, agent-driven LeetCode interview-review system (JSON/JSONL storage, spaced repetition)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leetcode_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
